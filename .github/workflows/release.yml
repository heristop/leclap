name: Release

# Changesets-driven release.
#   - On every push to main: open/update the "Version Packages" PR (bumps versions +
#     changelogs). This NEVER publishes.
#   - Publishing is manual: trigger "Run workflow" (workflow_dispatch) to publish the
#     bumped packages to npm + create GitHub releases.
# See .changeset/ for the workflow and CONTRIBUTING for how to add a changeset.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    name: Version Packages PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          # Changesets needs full history to diff against the base branch and tag releases.
          fetch-depth: 0

      # No media step here on purpose. This job builds only ffmpeg-video-composer, @leclap/cli and
      # @leclap/mcp — none of which depend on @leclap/creative-kit or embed any of its media: each
      # `build` is a bare tsdown over TypeScript entries, and every published `files` list is dist/
      # plus markdown. Assets are fetched at runtime from the raw-GitHub base URL in asset-source.ts.
      # This previously ran `git lfs pull`, which under this repo's exhausted LFS budget exits 0 while
      # materializing nothing — it never did anything but hide that fact.

      # Toolchain pinned in mise.toml (Node, pnpm).
      - name: Set up toolchain (mise)
        uses: jdx/mise-action@v4

      - name: Install Dependencies
        run: pnpm i

      - name: Create or Update Version Packages PR
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to npm
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          # Changesets needs full history to diff against the base branch and tag releases.
          fetch-depth: 0

      # No media step here on purpose — see the note in the `version` job above. The published
      # packages embed none of the creative-kit library.

      # Toolchain pinned in mise.toml (Node, pnpm).
      - name: Set up toolchain (mise)
        uses: jdx/mise-action@v4

      - name: Install Dependencies
        run: pnpm i

      # The published packages depend on ffmpeg-video-composer by plain semver range, never by pnpm's
      # `workspace:*` protocol. That protocol only survives if pnpm does the packing; `changeset
      # publish` and a bare `npm publish` both shell out to npm, which ships the literal string
      # "workspace:*" to the registry — @leclap/cli 0.2.2/0.2.3 and @leclap/mcp 0.3.0/0.3.1 all went
      # out that way and cannot be installed at all (EUNSUPPORTEDPROTOCOL).
      #
      # A semver range cannot be published wrong by any packer, so releasing works the same whether it
      # runs here, via `pnpm release`, or via a hand-run `npm publish`.
      # `tests/repo/package-metadata.test.ts` pins it.
      - name: Publish Packages
        uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
