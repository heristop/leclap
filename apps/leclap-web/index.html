<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>LeClap — Cinematic Video Composer in Your Browser</title>
    <meta
      name="description"
      content="Create cinematic videos from templates right in your browser. LeClap runs client-side with WebAssembly and FFmpeg — no uploads, no servers, no limits."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#0b0b0f" />
    <link rel="canonical" href="https://leclap.dev/" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LeClap" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LeClap" />
    <meta property="og:title" content="LeClap — Cinematic Video Composer in Your Browser" />
    <meta
      property="og:description"
      content="Build cinematic videos from templates entirely in your browser. Powered by WebAssembly and FFmpeg — no uploads, no servers, no limits."
    />
    <meta property="og:url" content="https://leclap.dev/" />
    <meta property="og:image" content="https://leclap.dev/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="LeClap — cinematic video composer running in the browser" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LeClap — Cinematic Video Composer in Your Browser" />
    <meta
      name="twitter:description"
      content="Build cinematic videos from templates entirely in your browser. Powered by WebAssembly and FFmpeg — no uploads, no servers, no limits."
    />
    <meta name="twitter:image" content="https://leclap.dev/og-image.jpg" />
    <meta name="twitter:image:alt" content="LeClap — cinematic video composer running in the browser" />

    <!-- Fonts: Oswald is the primary UI face and is self-hosted (see @font-face in index.css), so we
         preload it on the critical path instead of pulling a render-blocking Google Fonts stylesheet —
         which also avoids an external request the COEP: require-corp policy would otherwise gate. -->
    <link rel="preload" href="/fonts/Oswald.woff2" as="font" type="font/woff2" crossorigin />

    <!-- No automatic language redirect. English is served at the bare root (the declared x-default);
         every other language lives under a path prefix (/fr, /de, …), reachable from the language
         picker, the hreflang alternates and the sitemap. A visitor whose browser prefers another
         language is offered it by <LanguageSuggestion>, never sent there behind their back:
           • the URL someone typed or shared is never rewritten;
           • / stays a plain cacheable 200 for every agent, so no user-agent sniffing is needed to
             keep it crawlable — which is Google's own guidance ("avoid automatic redirection based
             on the user's perceived language… consider using banners or links");
           • a root-only redirect is inconsistent by construction: a deep link keeps the language it
             was shared in, so the language would flip the moment the visitor clicked Home. -->

    <!-- The hero's full-bleed clapperboard texture is the LCP element, but only on the home route. A
         static <link rel="preload"> in this shared shell would fetch it on every page and log a
         "preloaded but unused" warning off-home — so inject it from an inline head script only when the
         path is a home root (root or a locale prefix). Still in <head> and synchronous, so on home it
         races ahead of the CSS that references the background. -->
    <script>
      (function () {
        var p = location.pathname.replace(/\/$/, '') || '/';
        var homeRoots = ['/', '/fr', '/de', '/es', '/it'];
        if (homeRoots.indexOf(p) === -1) return;
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'image';
        link.setAttribute('fetchpriority', 'high');
        link.href = '/images/hero-texture.webp';
        document.head.appendChild(link);
      })();
    </script>

    <!-- Structured data: the web app itself. It carries an @id so the SoftwareSourceCode block
         below can point at it (targetProduct) instead of leaving two unlinked top-level entities,
         which would make the page's primary subject ambiguous to a consumer. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "@id": "https://leclap.dev/#webapp",
        "name": "LeClap",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Any (modern web browser)",
        "url": "https://leclap.dev/",
        "description": "A cinematic video composer that runs entirely in the browser, building videos from templates with WebAssembly and FFmpeg — no servers or uploads.",
        "browserRequirements": "Requires a browser with WebAssembly support",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
    <!-- Structured data: the open-source project behind the app. The description is the canonical
         one-liner from .github/repo-metadata.json — same pitch on GitHub, on npm and here, so a
         crawler that reads any one of them summarises the project the same way. It says
         "deterministic" and names the runtimes; it deliberately does not claim identical bytes
         across them (the encoder differs per platform — see the caveat table in README.md). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareSourceCode",
        "@id": "https://leclap.dev/#source",
        "name": "LeClap",
        "targetProduct": { "@id": "https://leclap.dev/#webapp" },
        "description": "Deterministic video composition from one JSON template — renders on Node, in the browser via WebAssembly, and fully on-device on React Native. No server, no upload, no generative model. Agent-callable over MCP.",
        "codeRepository": "https://github.com/heristop/leclap",
        "programmingLanguage": ["TypeScript", "Rust"],
        "runtimePlatform": ["Node.js", "WebAssembly", "React Native"],
        "license": "https://opensource.org/licenses/MIT",
        "author": { "@type": "Person", "name": "Alexandre Mogère" }
      }
    </script>
    <!-- The analytics tag. Swapped wholesale at build time for the configured tracker — a
         self-hosted Umami replaces everything between these markers with its own cookieless
         tag, and then none of the consent machinery below ships at all. See vite.config.ts and
         src/config/analytics-mode.ts; site.test.ts pins the markers so the swap cannot go
         silently missing. -->
    <!-- analytics:start -->
    <!-- Google Analytics 4. gtag.js is not requested here: with analytics_storage denied the tag still
         sends a cookieless ping, so Consent Mode alone would not make "nothing is sent unless you
         allow it" true. Only loadGoogleAnalytics() fetches the library, called by <ConsentBanner> or
         by a stored yes below. The shim lives here rather than in lib/analytics.ts because gtag.js
         only reads dataLayer entries that are `arguments` objects — an array sends no hit. The
         measurement id belongs to src/config/site.ts; site.test.ts pins this copy to it. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        window.dataLayer.push(arguments);
      }
      window.gtag = gtag;

      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
      });

      gtag('js', new Date());
      // send_page_view: false — the router changes pages without reloading, so every page_view
      // including the first is sent by usePageViews(); leaving it on double-counts the landing page.
      gtag('config', 'G-RLQZSC8H80', { send_page_view: false });

      window.loadGoogleAnalytics = function () {
        if (document.getElementById('ga-tag')) return;
        var tag = document.createElement('script');
        tag.id = 'ga-tag';
        tag.async = true;
        tag.src = 'https://www.googletagmanager.com/gtag/js?id=G-RLQZSC8H80';
        document.head.appendChild(tag);
      };

      try {
        if (localStorage.getItem('leclap-consent') === 'granted') {
          gtag('consent', 'update', { analytics_storage: 'granted' });
          window.loadGoogleAnalytics();
        }
      } catch (e) {
        /* storage blocked — stay denied and load nothing */
      }
    </script>
    <!-- analytics:end -->

    <!-- Apply the theme before paint to avoid a flash of the wrong one. Default is the OS color
         scheme; a saved choice (only written when the user toggles) overrides it. -->
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('leclap-theme');
        } catch (e) {
          /* storage blocked — fall through to the system preference */
        }
        var prefersDark = globalThis.matchMedia && globalThis.matchMedia('(prefers-color-scheme: dark)').matches;
        var dark = stored === 'dark' || (stored !== 'light' && prefersDark);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
